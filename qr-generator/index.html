<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>QR Code Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eef2ff;background:radial-gradient(circle at 15% 0%,#25346a 0,transparent 36%),#0b1020;display:flex;justify-content:center;align-items:center}
    .app{width:min(100%,760px)}header{text-align:center;margin-bottom:25px}h1{font-size:clamp(30px,6vw,46px);margin:0 0 8px;letter-spacing:-1.5px}header p{color:#aab5d2;margin:0}
    .panel{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;background:#151d33;border:1px solid #293654;border-radius:22px;padding:22px;box-shadow:0 24px 70px #0006}
    label{display:block;font-size:13px;font-weight:650;color:#c7d2ee;margin:0 0 8px}.field{margin-bottom:17px}textarea,input,select{width:100%;border:1px solid #344363;background:#0e1629;color:#f4f6ff;border-radius:11px;padding:12px 13px;font:inherit;outline:none}textarea{min-height:120px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:#8b9cff;box-shadow:0 0 0 3px #8294ff22}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-width:0}.option input[type=color]{height:44px;padding:5px}.option select{height:44px}
    button{border:0;border-radius:11px;padding:13px 16px;font-weight:750;font-size:14px;cursor:pointer;transition:transform .15s,opacity .15s}button:hover{transform:translateY(-1px)}.primary{width:100%;background:linear-gradient(135deg,#8b9cff,#a78bfa);color:#10152a}.secondary{background:#263451;color:#e8edff}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}
    .preview{background:#0e1629;border:1px solid #293957;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;min-height:330px;text-align:center}.qr-frame{background:#fff;border-radius:13px;padding:14px;min-width:190px;min-height:190px;display:grid;place-items:center}.qr-frame canvas,.qr-frame img{max-width:100%;height:auto}.hint{color:#9eaccb;font-size:13px;margin:16px 0 0}.status{min-height:18px;color:#aebcff;font-size:12px;margin-top:10px}
    footer{text-align:center;color:#7785a6;font-size:12px;margin-top:17px}
    @media(max-width:620px){.panel{grid-template-columns:1fr;padding:16px}.preview{min-height:280px;order:-1}.qr-frame{min-width:180px;min-height:180px}}
  </style>
</head>
<body>
<main class="app">
  <header><h1>QR Code Generator</h1><p>Create a QR code for a link, text, Wi-Fi details, or anything you want.</p></header>
  <section class="panel">
    <div>
      <div class="field"><label for="content">Text or URL</label><textarea id="content" placeholder="https://example.com"></textarea></div>
      <div class="options">
        <div class="field option"><label for="size">QR size</label><select id="size"><option value="180">180 × 180</option><option value="256" selected>256 × 256</option><option value="320">320 × 320</option><option value="400">400 × 400</option></select></div>
        <div class="field option"><label for="dark">QR color</label><input id="dark" type="color" value="#111827"></div>
        <div class="field option"><label for="light">Background</label><input id="light" type="color" value="#ffffff"></div>
      </div>
      <button class="primary" id="generate">Generate QR Code</button>
      <div class="actions"><button class="secondary" id="download" disabled>Download PNG</button><button class="secondary" id="clear">Clear</button></div>
      <div class="status" id="status" role="status"></div>
    </div>
    <div class="preview"><div class="qr-frame" id="qrcode"><span style="color:#667085;font-size:13px">Your QR code appears here</span></div><p class="hint">Scan with your phone camera</p></div>
  </section>
  <footer>Fast · Free · Works in your browser</footer>
</main>
<script>
  const input=document.getElementById('content'),size=document.getElementById('size'),dark=document.getElementById('dark'),light=document.getElementById('light');
  const output=document.getElementById('qrcode'),download=document.getElementById('download'),status=document.getElementById('status');
  let qr=null;
  function generate(){
    const value=input.value.trim();
    if(!value){status.textContent='Please enter some text or a URL first.';input.focus();return;}
    if(typeof QRCode==='undefined'){status.textContent='QR library could not load. Check your internet connection.';return;}
    output.innerHTML='';
    qr=new QRCode(output,{text:value,width:Number(size.value),height:Number(size.value),colorDark:dark.value,colorLight:light.value,correctLevel:QRCode.CorrectLevel.H});
    download.disabled=false;status.textContent='QR code generated successfully.';
  }
  document.getElementById('generate').addEventListener('click',generate);
  document.getElementById('clear').addEventListener('click',()=>{input.value='';output.innerHTML='<span style="color:#667085;font-size:13px">Your QR code appears here</span>';download.disabled=true;qr=null;status.textContent='';});
  [size,dark,light].forEach(el=>el.addEventListener('change',()=>{if(input.value.trim())generate();}));
  download.addEventListener('click',()=>{
    const canvas=output.querySelector('canvas'),img=output.querySelector('img');
    let url=canvas?canvas.toDataURL('image/png'):img?.src;
    if(!url){status.textContent='Generate a QR code first.';return;}
    const a=document.createElement('a');a.href=url;a.download='qr-code.png';document.body.appendChild(a);a.click();a.remove();
  });
  input.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')generate();});
</script>
</body>
</html>
